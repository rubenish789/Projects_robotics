name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check file exists
        run: test -f README.md

      - name: Lint check
        run: echo "Lint passed"

      - name: Build project
        run: echo "Build complete"

      - name: Check README
        run: grep "project" README.md
